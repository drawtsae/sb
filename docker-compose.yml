# Portainer stack (Stacks → Add stack → paste this, or point "Repository" at this repo).
# Every setting comes from the stack's "Environment variables" section — no .env file is
# mounted. See .env.production.example for the list (Portainer can load it with
# "Load variables from .env file").
#
# HTTPS is required for the offline mode (service worker + Cache Storage). Put the app
# behind your own reverse proxy with TLS (Nginx Proxy Manager, Traefik, Cloudflare Tunnel…)
# and set TRUST_PROXY_HOPS=1 so the login rate limit sees the real client IP.
services:
  app:
    image: ghcr.io/drawtsae/sb:${IMAGE_TAG:-latest}
    restart: unless-stopped
    environment:
      ADMIN_EMAIL: ${ADMIN_EMAIL:-}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
      MAX_UPLOAD_MB: ${MAX_UPLOAD_MB:-100}
      COOKIE_SECURE: ${COOKIE_SECURE:-true}
      TRUST_PROXY_HOPS: ${TRUST_PROXY_HOPS:-0}
    ports:
      - "${APP_PORT:-3000}:3000"
    volumes:
      - soundboard-data:/data

volumes:
  # Pinned name: without it the stack name is prefixed, and backup/restore commands
  # (`docker run -v soundboard-data:/data …`) would hit a different, empty volume.
  soundboard-data:
    name: soundboard-data
