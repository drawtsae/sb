services:
  app:
    # Prebuilt by .github/workflows/docker.yml: `docker compose pull && docker compose up -d`.
    # `docker compose up -d --build` still builds locally from ./Dockerfile instead.
    image: ghcr.io/drawtsae/sb:latest
    build: .
    env_file: .env
    environment:
      DATA_DIR: /data
    volumes:
      - soundboard-data:/data
    restart: unless-stopped
    # NOTE: no `ports:` on purpose. Only Caddy is published (80/443).
    # Login rate limiting keys on the first X-Forwarded-For entry. Caddy sets that
    # from the real client IP (it does not trust an incoming XFF), so the app must
    # only be reachable through Caddy. Do not publish port 3000.
    expose:
      - "3000"

  caddy:
    image: caddy:2
    environment:
      DOMAIN: "${DOMAIN}"
      ACME_EMAIL: "${ACME_EMAIL}"
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      - app
    restart: unless-stopped

volumes:
  # Pinned name: without it compose prefixes the project name, and
  # `docker run -v soundboard-data:/data` would hit a different, empty volume.
  soundboard-data:
    name: soundboard-data
  caddy-data:
  caddy-config:
